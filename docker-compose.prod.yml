services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3-management

  backend:
    build: ./server
    image: djrecommerce-server
    environment:
      ENVIRONMENT: production
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8000:8000"

  celery_worker:
    build: ./server
    image: djrecommerce-celery-worker
    command: celery -A workers worker -l info
    depends_on:
      - backend
      - redis
      - rabbitmq

  event_consumer:
    build: ./server
    image: djrecommerce-event-consumer
    command: python manage.py run_notifications_consumer
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
